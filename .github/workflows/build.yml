name: build

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.3
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests (including real-registry and GUI checks)
        run: python -m pytest -q
      - name: Build danidUn.exe
        run: python -m PyInstaller --noconfirm --clean danidUn.spec
      - uses: actions/upload-artifact@v4
        with:
          name: danidUn-exe
          path: dist/danidUn.exe
